name: Firebase Hosting デプロイ

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["除排雪状況取得"]
    types: [completed]

jobs:
  deploy:
    if: ${{ github.event_name == 'push' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v6

      - name: Firebase API キーを注入
        run: sed -i 's/__FIREBASE_API_KEY__/${{ secrets.FIREBASE_API_KEY }}/' docs/index.html

      - name: Google Cloud 認証
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Node.js セットアップ
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Firebase CLI インストール
        run: npm install -g firebase-tools

      - name: Hosting と Realtime Database ルールをデプロイ
        run: firebase deploy --only hosting,database --project aomori-snow-tracker --non-interactive
