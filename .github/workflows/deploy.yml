name: Firebase Hosting デプロイ

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["除排雪状況取得"]
    types: [completed]

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ github.event_name == 'push' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Firebase API キーを注入
        run: sed -i 's/__FIREBASE_API_KEY__/${{ secrets.FIREBASE_API_KEY }}/' docs/index.html docs/js/app.js

      - name: Google Cloud 認証
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Node.js セットアップ
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '20'

      - name: Firebase CLI インストール
        run: npm install -g firebase-tools

      - name: Hosting と Realtime Database ルールをデプロイ
        run: firebase deploy --only hosting,database --project aomori-snow-tracker --non-interactive
