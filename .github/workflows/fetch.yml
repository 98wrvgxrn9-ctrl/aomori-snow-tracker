name: バス運行状況取得

on:
  schedule:
    # 日本時間 7:00〜22:00 の毎時0分に実行
    # UTC 22:00〜13:00
    - cron: '0 22-23,0-13 * * *'
  workflow_dispatch:  # 手動実行用

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v6

      # 来シーズン再開時は以下の if: false を削除する
      - name: FMSデータリポジトリをチェックアウト
        if: false
        uses: actions/checkout@v6
        with:
          repository: 98wrvgxrn9-ctrl/fms-data
          path: fms-data
          token: ${{ secrets.FMS_REPO_TOKEN }}

      - name: Python セットアップ
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: 依存関係インストール
        run: pip install -r requirements.txt

      # 来シーズン再開時は以下の if: false を削除する
      - name: KML取得・解析
        if: false
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
        run: python scripts/fetch_kml.py

      - name: FMSリスク集計
        if: false
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
        run: python scripts/gen_fms_risk.py

      - name: 前日サマリー生成
        if: false
        run: python scripts/gen_prev_summary.py

      - name: 国道除雪状況取得
        if: false
        run: python scripts/fetch_kokudo_status.py

      - name: バス運行状況取得
        run: python scripts/fetch_bus_status.py

      - name: 変更をコミット・プッシュ
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/
          git diff --staged --quiet || git commit -m "data: $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M') バス運行状況を更新"
          git pull origin main --no-rebase -X ours || true
          git push origin main
